<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-sunken: #ebecf0;
    --border: #dfe1e6;
    --text: #172b4d;
    --text-muted: #6b778c;
    --accent: #2f6fed;
    --accent-text: #ffffff;
    --danger: #c9372c;
    --danger-soft: #ffeceb;
    --warning: #a54800;
    --warning-soft: #fff4e5;
    --success: #216e4e;
    --success-soft: #e6f4ec;
    --shadow-card: 0 1px 2px rgba(9, 30, 66, 0.18);
    --shadow-raised: 0 8px 24px rgba(9, 30, 66, 0.22);
    --radius: 8px;
    --app-bar-height: 56px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10141c;
      --surface: #1c2230;
      --surface-sunken: #161b26;
      --border: #2c3446;
      --text: #e6eaf2;
      --text-muted: #97a2ba;
      --accent: #5b8dff;
      --accent-text: #0b1020;
      --danger: #ff8073;
      --danger-soft: #3a1d1a;
      --warning: #f0b45f;
      --warning-soft: #3a2c14;
      --success: #6fd3a3;
      --success-soft: #14312a;
      --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.5);
      --shadow-raised: 0 10px 28px rgba(0, 0, 0, 0.6);
    }
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  [hidden] {
    display: none !important;
  }

  html,
  body {
    height: 100%;
  }

  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------------------------------------------------------------- app bar */

  .app-bar {
    flex: 0 0 auto;
    min-height: var(--app-bar-height);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding: 8px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .app-bar__brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
    min-width: 0;
  }

  .app-bar__title {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .app-bar__meta {
    color: var(--text-muted);
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .app-bar__actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .pill {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--surface-sunken);
    color: var(--text-muted);
    white-space: nowrap;
  }

  .pill[data-state="saving"],
  .pill[data-state="loading"] {
    background: var(--warning-soft);
    color: var(--warning);
  }

  .pill[data-state="saved"] {
    background: var(--success-soft);
    color: var(--success);
  }

  .pill[data-state="error"] {
    background: var(--danger-soft);
    color: var(--danger);
  }

  /* ---------------------------------------------------------------- buttons */

  .button {
    font: inherit;
    font-weight: 500;
    padding: 7px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }

  .button:hover {
    background: var(--surface-sunken);
  }

  .button:focus-visible,
  .input:focus-visible,
  .card:focus-visible,
  .icon-button:focus-visible,
  .column__add:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .button:disabled {
    opacity: 0.55;
    cursor: default;
  }

  .button--primary {
    background: var(--accent);
    border-color: transparent;
    color: var(--accent-text);
  }

  .button--primary:hover {
    background: var(--accent);
    filter: brightness(1.07);
  }

  .button--danger {
    color: var(--danger);
    border-color: transparent;
    background: var(--danger-soft);
  }

  .icon-button {
    font: inherit;
    font-size: 22px;
    line-height: 1;
    width: 32px;
    height: 32px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
  }

  .icon-button:hover {
    background: var(--surface-sunken);
    color: var(--text);
  }

  /* ----------------------------------------------------------- placeholders */

  .placeholder {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 24px;
    color: var(--text-muted);
    text-align: center;
  }

  .placeholder--error {
    color: var(--danger);
  }

  .placeholder p {
    margin: 0;
    max-width: 42ch;
  }

  .spinner {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .spinner {
      animation-duration: 2.4s;
    }
  }

  /* ------------------------------------------------------------------ board */

  .board {
    flex: 1 1 auto;
    display: flex;
    align-items: stretch; /* full-height columns are easier drop targets */
    gap: 12px;
    padding: 16px;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity;
  }

  .column {
    flex: 1 0 282px;
    max-width: 380px;
    max-height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--surface-sunken);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    scroll-snap-align: start;
  }

  .column__header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 12px 6px;
  }

  .column__name {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .column__count {
    flex: 0 0 auto;
    font-size: 12px;
    color: var(--text-muted);
    background: var(--surface);
    border-radius: 999px;
    padding: 1px 8px;
  }

  .column__list {
    flex: 1 1 auto;
    min-height: 40px;
    overflow-y: auto;
    padding: 4px 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /*
   * The empty-column hint is generated content rather than a child element:
   * SortableJS derives drop positions from child indexes, so a placeholder
   * node would offset every insert into an empty column.
   */
  .column__list:empty::after {
    content: "Drop a card here";
    display: block;
    padding: 14px 4px;
    color: var(--text-muted);
    font-size: 12.5px;
    text-align: center;
  }

  .column__footer {
    flex: 0 0 auto;
    padding: 6px 8px 8px;
  }

  .column__add {
    width: 100%;
    font: inherit;
    text-align: left;
    padding: 7px 8px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
  }

  .column__add:hover {
    background: var(--surface);
    color: var(--text);
  }

  .composer {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .composer__input {
    font: inherit;
    resize: vertical;
    min-height: 56px;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
  }

  .composer__actions {
    display: flex;
    gap: 6px;
  }

  /* ------------------------------------------------------------------ cards */

  .card {
    background: var(--surface);
    border-radius: 6px;
    box-shadow: var(--shadow-card);
    padding: 9px 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .card:hover {
    background: var(--surface);
    filter: brightness(0.985);
  }

  .card__title {
    font-weight: 500;
    overflow-wrap: anywhere;
  }

  .card__description {
    margin: 0;
    font-size: 12.5px;
    color: var(--text-muted);
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow-wrap: anywhere;
  }

  .card__meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--surface-sunken);
    color: var(--text-muted);
    max-width: 100%;
  }

  .chip--overdue {
    background: var(--danger-soft);
    color: var(--danger);
    font-weight: 500;
  }

  .chip--soon {
    background: var(--warning-soft);
    color: var(--warning);
  }

  .chip__text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .avatar {
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .card.is-saving {
    opacity: 0.6;
  }

  .card-ghost {
    opacity: 0.4;
  }

  .card-chosen {
    box-shadow: var(--shadow-raised);
  }

  .card-drag {
    transform: rotate(2deg);
  }

  /* ----------------------------------------------------------------- editor */

  .scrim {
    position: fixed;
    inset: 0;
    background: rgba(9, 30, 66, 0.45);
    z-index: 20;
  }

  .editor {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(400px, 100%);
    z-index: 30;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-left: 1px solid var(--border);
    box-shadow: var(--shadow-raised);
    transform: translateX(100%);
    visibility: hidden;
    transition: transform 0.18s ease-out, visibility 0.18s;
  }

  .editor.is-open {
    transform: none;
    visibility: visible;
  }

  @media (prefers-reduced-motion: reduce) {
    .editor {
      transition: none;
    }
  }

  .editor__header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 12px 12px 16px;
    border-bottom: 1px solid var(--border);
  }

  .editor__title {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
  }

  .editor__body {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .editor__footer {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
  }

  .editor__hint,
  .editor__error {
    margin: 0;
    font-size: 12px;
    color: var(--text-muted);
  }

  .editor__error {
    color: var(--danger);
    background: var(--danger-soft);
    border-radius: 6px;
    padding: 8px 10px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .field__label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
  }

  .field-row {
    display: flex;
    gap: 12px;
  }

  .field-row .field {
    flex: 1 1 0;
    min-width: 0;
  }

  .input {
    font: inherit;
    width: 100%;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
  }

  .input--multiline {
    resize: vertical;
    min-height: 90px;
  }

  .input.is-invalid {
    border-color: var(--danger);
  }

  /* ------------------------------------------------------------------ toast */

  .toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    z-index: 40;
    max-width: min(460px, calc(100% - 32px));
    padding: 10px 14px;
    border-radius: 8px;
    background: var(--text);
    color: var(--bg);
    box-shadow: var(--shadow-raised);
    font-size: 13px;
  }

  .toast[data-tone="error"] {
    background: var(--danger);
    color: #fff;
  }

  /* ----------------------------------------------------------------- mobile */

  @media (max-width: 640px) {
    .app-bar {
      padding: 8px 12px;
    }

    .app-bar__actions {
      width: 100%;
      justify-content: flex-end;
    }

    .board {
      padding: 12px;
      gap: 10px;
    }

    .column {
      flex: 0 0 84vw;
      max-width: 84vw;
    }

    .editor {
      width: 100%;
      top: 8vh;
      border-left: 0;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
      transform: translateY(100%);
    }

    .editor.is-open {
      transform: none;
    }
  }
</style>
