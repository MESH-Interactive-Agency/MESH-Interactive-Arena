<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>Claude Usage</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

  <header class="titlebar">
    <div class="brand">
      <span class="live"><span class="dot"></span>LIVE</span>
      <span class="title">Claude Usage</span>
      <span id="plan" class="plan"></span>
    </div>
    <button id="close" class="icon-btn no-drag" title="Hide to tray" aria-label="Hide">
      <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </header>

  <main>
    <div id="error" class="error" hidden></div>

    <section class="hero">
      <svg id="gauge" viewBox="0 0 260 260" role="img" aria-labelledby="gaugeTitle">
        <title id="gaugeTitle">Outer ring weekly usage, inner ring session usage</title>
        <defs>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <linearGradient id="gWeekly" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="s0"/><stop offset="1" class="s1"/></linearGradient>
          <linearGradient id="gSession" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="s0"/><stop offset="1" class="s1"/></linearGradient>
        </defs>
        <g id="ticks"></g>
        <circle class="track" cx="130" cy="130" r="112"/>
        <circle class="track" cx="130" cy="130" r="86"/>
        <circle id="arcWeekly" class="arc" cx="130" cy="130" r="112" stroke="url(#gWeekly)" filter="url(#glow)"/>
        <circle id="arcSession" class="arc" cx="130" cy="130" r="86" stroke="url(#gSession)" filter="url(#glow)"/>
        <text class="ring-label" x="112" y="23" text-anchor="end">7D</text>
        <text class="ring-label" x="112" y="49" text-anchor="end">5H</text>
      </svg>
      <div class="hero-center">
        <div id="statusChip" class="status unknown"><span id="statusIcon" class="status-icon"></span><span id="statusText">Connecting</span></div>
        <div class="headline"><span id="headline">--</span><small>%</small></div>
        <div id="headlineSub" class="sub">peak of session &amp; weekly</div>
      </div>
    </section>

    <section class="limits">
      <article class="limit" id="sessionCard">
        <header><span class="swatch inner"></span>Session <em>5-hour</em></header>
        <div class="pct"><span id="sessionPct">--</span><small>%</small></div>
        <div class="meter"><div id="sessionBar"></div></div>
        <footer><span id="sessionReset">--</span><span class="chip" id="sessionCountdown"></span></footer>
      </article>
      <article class="limit" id="weeklyCard">
        <header><span class="swatch outer"></span>Weekly <em>all models</em></header>
        <div class="pct"><span id="weeklyPct">--</span><small>%</small></div>
        <div class="meter"><div id="weeklyBar"></div></div>
        <footer><span id="weeklyReset">--</span><span class="chip" id="weeklyCountdown"></span></footer>
      </article>
    </section>
    <div id="weeklyExtra" class="extra"></div>

    <section class="panel">
      <header class="panel-head">
        <h2>Claude Code activity <em>this Mac · last 7 days</em></h2>
      </header>
      <div class="totals">
        <div><label>Today</label><strong id="todayTokens">--</strong><span id="todayMsgs"></span></div>
        <div><label>This week</label><strong id="weekTokens">--</strong><span id="weekMsgs"></span></div>
      </div>
      <div class="chart" id="chart" role="img" aria-label="Tokens per day, last 7 days"></div>
      <div class="tooltip" id="tip" hidden></div>
      <div class="split" id="split" aria-label="Tokens by model this week"></div>
      <div class="legend" id="legend"></div>
    </section>
  </main>

  <footer class="bottombar">
    <span id="updated" class="muted">--</span>
    <div class="actions">
      <label class="toggle no-drag" title="Keep window above other apps">
        <input type="checkbox" id="pin"><span class="knob"></span>On top
      </label>
      <button id="refresh" class="icon-btn no-drag" title="Refresh now" aria-label="Refresh">
        <svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"/></svg>
      </button>
    </div>
  </footer>
  <script src="app.js"></script>
</body>
</html>
